<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="keywords"
          content="HTML5, CSS3, таблиці, transform, лабораторна робота">
    <meta name="description"
          content="Лабораторна робота №2 Хімченко Ксенії Максимівни">

    <title>Хімченко К.М. ІА-42</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Лабораторна робота №2</h1>

    <h2>Завдання 1. Таблиця</h2>

    <table class="info-table">

        <tr class="first-row">
            <td colspan="2" rowspan="2">Хімченко</td>
            <td>Ксенія</td>
            <td>Максимівна</td>
        </tr>
    
        <tr class="first-row">
            <td>ІА-42</td>
            <td>ЛР-2 Варіант 7</td>
        </tr>
    
        <tr class="second-row">
            <td colspan="2">ІА-42</td>
            <td>ЛР-2</td>
            <td rowspan="2">Варіант 7</td>
        </tr>
    
        <tr class="second-row">
            <td>Хімченко</td>
            <td>Ксенія</td>
            <td>Максимівна</td>
        </tr>
    
    </table>


    <h2>Завдання 2. Зображення</h2>

    <div class="clock">

        <!-- Чотири червоні точки -->

        <div class="point point-top"></div>
        <div class="point point-right"></div>
        <div class="point point-bottom"></div>
        <div class="point point-left"></div>

        <!-- Стрілки -->

        <div class="hand vertical-hand"></div>
        <div class="hand horizontal-hand"></div>

    </div>

</body>

</html>
