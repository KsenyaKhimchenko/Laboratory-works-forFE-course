<!DOCTYPE html>
<html lang="uk">

<head>

    <meta name="description"
          content="Лабораторна робота №3 Хімченко Ксенії Максимівни">

            </div>

         ========================= -->

            Text
        </div>

        <div class="flex-main">

            <div class="flex-image">
                Img.
            </div>

                Text
            </div>

            Img.
        </div>
